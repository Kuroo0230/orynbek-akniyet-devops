services:
  student-app:
    build: .
    image: orynbek-akniyet-devops:1.0
    container_name: orynbek-akniyet-compose
    environment:
      STUDENT_NAME: Akniyet
      STUDENT_SURNAME: Orynbek
      STUDENT_GROUP: IT2-2310
      STUDENT_ID: "38385"
